<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- css: bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
</head>
<body>
    <!-- code here -->
    <div class="container">
        <h1 class="text-center text-info mb-3">Quản lý sinh viên</h1>
        <form class="mb-3">
            <!-- name -->
            <div class="mb-3">
                <label for="name">Name</label>
                <input id="name" type="text" class="form-control"/>
            </div>
            <!-- birthday -->
            <div class="mb-3">
                <label for="birthday">Birthday</label>
                <input id="birthday" type="date" class="form-control"/>
            </div>
            <!-- nút btn submit -->
            <button class="btn btn-primary">Thêm</button>
        </form>
        <!-- tạo div thông báo -->
        <div id="notification">
            <div class="alert alert-success">Thành công</div>
        </div>
    </div>
    <!-- tạo table hiển thị danh sách sinh viên -->
    <table class="table table-bordered table-hover">
        <thead>
            <td>STT</td>
            <td>Tên</td>
            <td>Ngày sinh</td>
            <td>Hành động</td>
        </thead>
        <tbody>
            <!-- đô data vào thẻ body để k bị tràn vào table head -->
            <!-- <tr>
                <td>1</td>

                <td>
                    <button class="btn btn-danger btn-sm btn-remove" data-id="SID1">Xóa</button>
                </td>
            </tr> -->
        </tbody>
    </table>
    <!-- code here -->
    <script src="./style.js"></script>
</body>
</html>
