<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
        crossorigin="anonymous"
    >
    <style>
        .user, 
        #computer {
            font-size: 5rem;
            width: 130px;
        }
        .user.actived {
            background-color: #fd7e14;
        }
    </style>
</head>
<body>
    <!-- code here -->
    <div class="container">
        <h1 class="text-center">Kéo Búa Bao</h1>
        <div class="row mt-5">
            <!-- người -->
            <div class="col-6">
                <h2 class="text-center">Người chơi</h2>
                <div class="d-flex flex-column justify-content-center align-items-center h-100">
                    <div class="mb-3">
                        <button class="btn btn-outline-warning user" id="scissors">✌🏻</button>
                    </div>
                     <div class="mb-3">
                        <button class="btn btn-outline-warning user" id="rock">✊🏻</button>
                    </div>
                     <div class="mb-3">
                        <button class="btn btn-outline-warning user" id="papper">🖐🏻</button>
                    </div>
                </div>
            </div>
            <!-- máy -->
            <div class="col-6">
                <h2 class="text-center">Máy chơi</h2>
                <div class="d-flex flex-column justify-content-center align-items-center h-100">
                    <div class="mb-3">
                        <span id="computer">✌🏻</span>
                    </div>
                </div>
            </div>
        </div>

        <!--  -->
        <div class="notification text-center">
            <!-- <p>bạn thua</p> -->
        </div>
        <!-- nút chơi lại -->
        <div id="play-again" class="text-center d-none">
            <button class="btn btn-primary btn-play-again">Chơi lại</button>
        </div>
    </div>
    <!-- code here -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
        crossorigin="anonymous">
    </script>
    <!-- thêm js của mình -->
    <script src="./style.js"></script>
</body>
</html>
